version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: calendalo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendalo
    ports:
      - '5433:5432'
    volumes:
      - calendalo_postgres_data:/var/lib/postgresql/data
volumes:
  calendalo_postgres_data:
